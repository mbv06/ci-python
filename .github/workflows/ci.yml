name: CI

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".github/workflows/ci.yml"
  # Monthly no-cache rebuild so apt packages stay fresh even when digests are unchanged.
  # Renovate bumps base digests on its own schedule; this run republishes rolling tags only.
  # Minute offset avoids GitHub's top-of-hour schedule contention.
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

# One active run per ref. Cancel superseded PR/validation runs, but never cancel an
# in-flight main publish — that can leave GHCR with a mixed set of variant tags.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  IMAGE_DESCRIPTION: A minimal Docker image with Python and essential CI tools, ready for running tests, builds, and other automation tasks.

jobs:
  setup:
    name: Generate build matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      variants: ${{ steps.set.outputs.variants }}
      is_release: ${{ steps.set.outputs.is_release }}
    steps:
      - id: set
        env:
          REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          full_variants='[
            {"python":"3.11","node":"24","cooldown":"7","suffix":""},
            {"python":"3.13","node":"24","cooldown":"7","suffix":""},
            {"python":"3.14","node":"24","cooldown":"7","suffix":""},
            {"python":"3.13","node":"24","cooldown":"3","suffix":"-cd3"}
          ]'
          slim_variants='[{"python":"3.13","node":"24","cooldown":"7","suffix":""}]'

          # Release = main → full matrix, push enabled.
          # PRs that touch Dockerfile → full matrix, build-only (variants share one Dockerfile).
          # Other validation runs → single "latest" variant, build-only.
          is_release=false
          use_full=false
          if [ "$REF" = "refs/heads/main" ]; then
            is_release=true
            use_full=true
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            if ! changed_files="$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --jq '.[].filename')"; then
              echo "::error::Failed to list changed files for pull request #${PR_NUMBER}"
              exit 1
            fi
            if grep -qx 'Dockerfile' <<< "$changed_files"; then
              use_full=true
            fi
          fi

          if [ "$use_full" = true ]; then
            variants="$full_variants"
          else
            variants="$slim_variants"
          fi
          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"
          {
            echo 'variants<<EOF'
            echo "$variants"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build py${{ matrix.variant.python }}-node${{ matrix.variant.node }}${{ matrix.variant.suffix }} (${{ matrix.platform.name }})
    needs: [setup]
    runs-on: ${{ matrix.platform.runner }}
    env:
      # Matrix jobs are consolidated into the single summary job below.
      DOCKER_BUILD_SUMMARY: "false"
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Each arch builds natively on its own runner; the merge job stitches the
        # per-arch digests into one multi-platform manifest per tag.
        platform:
          - { name: amd64, runner: ubuntu-latest, docker: linux/amd64 }
          - { name: arm64, runner: ubuntu-24.04-arm, docker: linux/arm64 }
        variant: ${{ fromJSON(needs.setup.outputs.variants) }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve Python base image pin
        id: base
        shell: bash
        run: |
          # Map matrix python (e.g. 3.13) → Dockerfile ARG PYTHON_IMAGE_3_13=image:tag@sha256:...
          key="PYTHON_IMAGE_$(echo '${{ matrix.variant.python }}' | tr . _)"
          image="$(sed -n "s/^ARG ${key}=//p" Dockerfile)"
          if [ -z "$image" ]; then
            echo "::error::Missing ARG ${key}=... in Dockerfile"
            exit 1
          fi
          echo "Using ${key}=${image}"
          echo "python_image=${image}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: needs.setup.outputs.is_release == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform.docker }}
          build-args: |
            PYTHON_IMAGE=${{ steps.base.outputs.python_image }}
            COOLDOWN_DAYS=${{ matrix.variant.cooldown }}
          # Scheduled runs skip cache so apt-get layers actually refresh.
          no-cache: ${{ github.event_name == 'schedule' }}
          # Release: push by digest for the merge job. Validation: load into the
          # local daemon so the smoke step can docker run without pushing.
          outputs: ${{ needs.setup.outputs.is_release == 'true' && format('type=image,name=ghcr.io/{0}/ci-python,push-by-digest=true,name-canonical=true,push=true', github.repository_owner) || 'type=docker,name=ci-python:smoke' }}
          cache-from: type=gha,scope=py${{ matrix.variant.python }}-node${{ matrix.variant.node }}${{ matrix.variant.suffix }}-${{ matrix.platform.name }}
          cache-to: type=gha,mode=max,scope=py${{ matrix.variant.python }}-node${{ matrix.variant.node }}${{ matrix.variant.suffix }}-${{ matrix.platform.name }}

      - name: Smoke test
        env:
          IS_RELEASE: ${{ needs.setup.outputs.is_release }}
          COOLDOWN_DAYS: ${{ matrix.variant.cooldown }}
          PYTHON_VERSION: ${{ matrix.variant.python }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ "$IS_RELEASE" = "true" ]; then
            image="ghcr.io/${{ github.repository_owner }}/ci-python@${DIGEST}"
          else
            image="ci-python:smoke"
          fi
          docker run --rm \
            -e COOLDOWN_DAYS \
            -e PYTHON_VERSION \
            "$image" \
            bash -c '
              set -euo pipefail
              python --version
              pip --version
              node --version
              npm --version
              uv --version
              git --version
              python -c "import os, sys; v=os.environ[\"PYTHON_VERSION\"]; assert sys.version_info[:2] == tuple(map(int, v.split(\".\"))), sys.version"
              test "$(npm config get min-release-age)" = "$COOLDOWN_DAYS"
              grep -q "uploaded-prior-to = P${COOLDOWN_DAYS}D" /etc/pip.conf
              grep -q "exclude-newer = \"P${COOLDOWN_DAYS}D\"" /etc/uv/uv.toml
            '

      - name: Export digest
        if: needs.setup.outputs.is_release == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: needs.setup.outputs.is_release == 'true'
        uses: actions/upload-artifact@v7
        with:
          # Cooldown is baked into the name (cd7/cd3) so the merge job's glob never
          # confuses a default variant with its -cd3 sibling.
          name: digest-py${{ matrix.variant.python }}-node${{ matrix.variant.node }}-cd${{ matrix.variant.cooldown }}-${{ matrix.platform.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge py${{ matrix.variant.python }}-node${{ matrix.variant.node }}${{ matrix.variant.suffix }}
    needs: [build, setup]
    if: needs.setup.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.setup.outputs.variants) }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-py${{ matrix.variant.python }}-node${{ matrix.variant.node }}-cd${{ matrix.variant.cooldown }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/ci-python
          tags: |
            type=raw,value=py${{ matrix.variant.python }}-node${{ matrix.variant.node }}${{ matrix.variant.suffix }}
            type=raw,value=py${{ matrix.variant.python }}${{ matrix.variant.suffix }},enable=${{ matrix.variant.node == '24' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && matrix.variant.python == '3.13' && matrix.variant.node == '24' && matrix.variant.cooldown == '7' }}
            # Commit-addressed tag only on push: schedule rebuilds must not retarget the same SHA tag.
            type=sha,prefix=py${{ matrix.variant.python }}-node${{ matrix.variant.node }}${{ matrix.variant.suffix }}-,enable=${{ github.event_name == 'push' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=$IMAGE_DESCRIPTION" \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/ci-python@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/ci-python:py${{ matrix.variant.python }}-node${{ matrix.variant.node }}${{ matrix.variant.suffix }}

  summary:
    name: CI summary
    needs: [setup, build, merge]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      SETUP_RESULT: ${{ needs.setup.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      MERGE_RESULT: ${{ needs.merge.result }}
      IS_RELEASE: ${{ needs.setup.outputs.is_release }}
      VARIANTS: ${{ needs.setup.outputs.variants }}
    steps:
      - name: Write consolidated summary
        shell: bash
        run: |
          status() {
            case "$1" in
              success) echo "✅ success" ;;
              failure) echo "❌ failure" ;;
              cancelled) echo "🚫 cancelled" ;;
              skipped) echo "⏭️ skipped" ;;
              *) echo "❔ ${1:-unknown}" ;;
            esac
          }

          {
            echo "## CI build summary"
            echo
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Matrix setup | $(status "$SETUP_RESULT") |"
            echo "| Image builds | $(status "$BUILD_RESULT") |"
            if [ "$IS_RELEASE" = "true" ]; then
              echo "| Multi-platform manifests | $(status "$MERGE_RESULT") |"
            else
              echo "| Multi-platform manifests | ⏭️ validation run |"
            fi

            if [ -n "$VARIANTS" ]; then
              echo
              echo "### Targets"
              echo
              echo "| Image | Cooldown | Platforms | Mode |"
              echo "| --- | ---: | --- | --- |"
              while IFS=$'\t' read -r python node cooldown suffix; do
                image="py${python}-node${node}${suffix}"
                if [ "$IS_RELEASE" = "true" ]; then
                  mode="published"
                else
                  mode="build only"
                fi
                echo "| \`$image\` | $cooldown days | amd64, arm64 | $mode |"
              done < <(jq -r '.[] | [.python, .node, .cooldown, .suffix] | @tsv' <<< "$VARIANTS")
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Required check: succeed only when every job that should have run succeeded.
      # On validation runs merge is skipped by design; treat that as OK.
      - name: Fail if any required job failed
        shell: bash
        run: |
          failed=0
          if [ "$SETUP_RESULT" != "success" ]; then
            echo "setup: $SETUP_RESULT"
            failed=1
          fi
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "build: $BUILD_RESULT"
            failed=1
          fi
          if [ "$IS_RELEASE" = "true" ]; then
            if [ "$MERGE_RESULT" != "success" ]; then
              echo "merge: $MERGE_RESULT"
              failed=1
            fi
          elif [ "$MERGE_RESULT" != "skipped" ] && [ "$MERGE_RESULT" != "success" ]; then
            echo "merge: $MERGE_RESULT"
            failed=1
          fi
          exit "$failed"
